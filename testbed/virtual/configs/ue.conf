# Public lab subscriber matched by open5gs.env. The container provides the
# UE network namespace; do not configure an absent host gw.netns namespace.
[rf]
freq_offset = 0
tx_gain = 0
rx_gain = 0
srate = 11.52e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://10.53.3.5:2001,rx_port=tcp://10.53.3.4:2000,base_srate=11.52e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 52
nof_prb = 52

[rrc]
release = 15
ue_category = 4

[usim]
mode = soft
algo = milenage
opc = 63bfa50ee6523365ff14c1f45f88737d
k = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[nas]
apn = internet
apn_protocol = ipv4

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[log]
filename = /traces/ue.log
all_level = info
phy_lib_level = warning

[pcap]
enable = none
