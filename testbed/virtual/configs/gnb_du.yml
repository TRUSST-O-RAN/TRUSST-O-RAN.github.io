# Based on the OCUDU CU/DU split tutorial's ZeroMQ example.
gnb_id: 1
gnb_id_bit_length: 22
f1ap:
  addrs: 10.53.2.3
  bind_addrs: 10.53.2.4
  retry_connection: true
f1u:
  socket:
    - bind_addr: 10.53.2.4
ru_sdr:
  device_driver: zmq
  # DU binds TX and connects to the UE's TX socket.
  device_args: tx_port=tcp://10.53.3.4:2000,rx_port=tcp://10.53.3.5:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 0
  rx_gain: 0
cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 6
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
    total_nof_ra_preambles: 64
    nof_ssb_per_ro: 1
    nof_cb_preambles_per_ssb: 64
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64
log:
  filename: /traces/du.log
  all_level: debug
pcap:
  f1ap_enable: true
  f1ap_filename: /traces/du_f1ap.pcap
