# Prepare pinned sources with: python testbed/virtual/scripts/testbed.py prepare
name: trusst-task11

x-ran: &ran
  image: trusst/ocudu-zmq:task11
  build:
    context: .
    dockerfile: docker/ocudu.Dockerfile
  cap_add: [SYS_NICE]
  ulimits:
    rtprio: 99
    memlock: -1
  stdin_open: true
  tty: true
  volumes:
    - ./configs:/configs:ro
    - ${TRUSST_TRACE_DIR:-./artifacts/current}:/traces

services:
  # Complete preconfigured core from OCUDU, including authentication NFs.
  open5gs:
    image: trusst/open5gs:2.7.6
    build:
      context: ./sources/ocudu/docker/open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: v2.7.6
        NUM_JOBS: "2"
    command: [5gc, -c, open5gs-5gc.yml]
    env_file: ./configs/open5gs.env
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - open5gs-db:/data/db
      # The pinned upstream helper repeats creation of ogstun in a loop.
      - ./docker/setup_tun.py:/open5gs/setup_tun.py:ro
      - ./configs/open5gs-5gc.yml.in:/open5gs/open5gs-5gc.yml.in:ro
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.20 7777"]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      core: {ipv4_address: 10.53.1.2}

  ocudu-cu:
    <<: *ran
    command: [ocu, -c, /configs/gnb_cu.yml]
    depends_on:
      open5gs: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "ss -H -l -A sctp | grep -q ':38472'"]
      interval: 2s
      timeout: 1s
      retries: 60
    networks:
      core: {ipv4_address: 10.53.1.3}
      f1: {ipv4_address: 10.53.2.3}

  ocudu-du:
    <<: *ran
    command: [odu, -c, /configs/gnb_du.yml]
    depends_on:
      ocudu-cu: {condition: service_healthy}
    networks:
      f1: {ipv4_address: 10.53.2.4}
      rf: {ipv4_address: 10.53.3.4}

  srsue:
    image: trusst/srsue:23.11
    build:
      context: .
      dockerfile: docker/srsue.Dockerfile
    command: [srsue, /configs/ue.conf]
    cap_add: [NET_ADMIN, SYS_NICE]
    devices: [/dev/net/tun:/dev/net/tun]
    stdin_open: true
    tty: true
    volumes:
      - ./configs:/configs:ro
      - ${TRUSST_TRACE_DIR:-./artifacts/current}:/traces
    depends_on:
      ocudu-du: {condition: service_started}
    networks:
      rf: {ipv4_address: 10.53.3.5}

volumes:
  open5gs-db:

# No radio or core ports are published on the host. Downloads need Internet;
# experiment traffic uses these private bridges.
networks:
  core:
    ipam:
      config: [{subnet: 10.53.1.0/24}]
  f1:
    internal: true
    ipam:
      config: [{subnet: 10.53.2.0/24}]
  rf:
    internal: true
    ipam:
      config: [{subnet: 10.53.3.0/24}]
