name: Virtual testbed checks
on:
  push:
    paths: ['testbed/virtual/**', '.github/workflows/virtual-testbed.yml']
  pull_request:
    paths: ['testbed/virtual/**', '.github/workflows/virtual-testbed.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r testbed/virtual/requirements-dev.txt
      - run: python testbed/virtual/scripts/testbed.py check
      - run: python -m pytest testbed/virtual/tests -q
